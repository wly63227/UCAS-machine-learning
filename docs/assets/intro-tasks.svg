<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="分类、回归与聚类的输出差异"><rect width="760" height="360" fill="#fff"/><style>text{font:14px sans-serif;fill:#23383b}.axis{stroke:#6b7779;stroke-width:1;fill:none}.main{stroke:#087f8c;fill:none;stroke-width:3}.alt{stroke:#a34b32;fill:none;stroke-width:3;stroke-dasharray:8 5}</style><text x="40" y="30" font-weight="bold">分类、回归与聚类的输出差异</text>
<g transform="translate(20 55)"><rect width="225" height="250" rx="10" fill="#fbfbf8" stroke="#d6ddd8"/><text x="112" y="28" text-anchor="middle" font-weight="bold">分类：输出离散类别</text><path d="M35 210V55M35 210H205" class="axis"/><path d="M65 195L175 70" class="main"/>
<g fill="#087f8c"><circle cx="62" cy="173" r="6"/><circle cx="78" cy="160" r="6"/><circle cx="88" cy="184" r="6"/><circle cx="95" cy="150" r="6"/></g><g fill="#a34b32"><circle cx="145" cy="105" r="6"/><circle cx="160" cy="92" r="6"/><circle cx="174" cy="116" r="6"/><circle cx="184" cy="82" r="6"/></g><text x="112" y="235" text-anchor="middle">例如：年轻 / 老年</text></g>
<g transform="translate(268 55)"><rect width="225" height="250" rx="10" fill="#fbfbf8" stroke="#d6ddd8"/><text x="112" y="28" text-anchor="middle" font-weight="bold">回归：输出连续数值</text><path d="M35 210V55M35 210H205" class="axis"/><path d="M48 192L195 70" class="main"/><g fill="#a34b32"><circle cx="52" cy="187" r="5"/><circle cx="74" cy="174" r="5"/><circle cx="93" cy="158" r="5"/><circle cx="118" cy="139" r="5"/><circle cx="146" cy="112" r="5"/><circle cx="180" cy="83" r="5"/></g><text x="112" y="235" text-anchor="middle">例如：面积 → 房价</text></g>
<g transform="translate(516 55)"><rect width="225" height="250" rx="10" fill="#fbfbf8" stroke="#d6ddd8"/><text x="112" y="28" text-anchor="middle" font-weight="bold">聚类：没有给定标签</text><g fill="#087f8c"><circle cx="65" cy="90" r="7"/><circle cx="82" cy="73" r="7"/><circle cx="92" cy="103" r="7"/></g><g fill="#a34b32"><rect x="148" y="85" width="14" height="14"/><rect x="170" y="68" width="14" height="14"/><rect x="171" y="101" width="14" height="14"/></g><ellipse cx="80" cy="88" rx="42" ry="38" fill="none" stroke="#087f8c"/><ellipse cx="170" cy="92" rx="42" ry="38" fill="none" stroke="#a34b32"/><text x="112" y="178" text-anchor="middle">分组取决于特征与准则</text><text x="112" y="235" text-anchor="middle">颜色、形状、大小</text></g></svg>