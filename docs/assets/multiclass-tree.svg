<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="四分类示例：两两训练与二叉淘汰测试"><rect width="760" height="360" fill="#fff"/><style>text{font:14px sans-serif;fill:#23383b}.axis{stroke:#6b7779;stroke-width:1;fill:none}.main{stroke:#087f8c;fill:none;stroke-width:3}.alt{stroke:#a34b32;fill:none;stroke-width:3;stroke-dasharray:8 5}</style><text x="40" y="30" font-weight="bold">四分类示例：两两训练与二叉淘汰测试</text><defs><marker id="arrm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f8c"/></marker></defs>
<text x="55" y="70" font-weight="bold">训练阶段：4 类的一对一分类器</text><text x="55" y="100">A/B　A/C　A/D　B/C　B/D　C/D</text><text x="55" y="130">共 4×3/2 = 6 个模型</text><path d="M310 115H390" stroke="#087f8c" stroke-width="2" marker-end="url(#arrm)"/>
<text x="430" y="55" font-weight="bold">测试阶段：一个样本走淘汰树</text>
<g text-anchor="middle"><rect x="420" y="85" width="110" height="42" rx="7" fill="#e6f2f0" stroke="#087f8c"/><text x="475" y="111">A vs B</text><rect x="610" y="85" width="110" height="42" rx="7" fill="#e6f2f0" stroke="#087f8c"/><text x="665" y="111">C vs D</text><rect x="515" y="195" width="110" height="48" rx="7" fill="#f4efe3" stroke="#a88442"/><text x="570" y="216">胜者 1</text><text x="570" y="234">vs 胜者 2</text><rect x="525" y="285" width="90" height="40" rx="7" fill="#fff" stroke="#6b7779"/><text x="570" y="310">最终类别</text></g>
<g stroke="#087f8c" stroke-width="2" marker-end="url(#arrm)"><path d="M475 127L545 190"/><path d="M665 127L595 190"/><path d="M570 243V280"/></g><text x="55" y="225">一条测试路径只做 3 次比较 = K-1。</text><text x="55" y="260">“训练 6 个模型”与“测试比较 3 次”不是同一个计数。</text></svg>