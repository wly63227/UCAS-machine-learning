<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="天气例：证据如何把先验更新为后验"><rect width="760" height="360" fill="#fff"/><style>text{font:14px sans-serif;fill:#23383b}.axis{stroke:#6b7779;stroke-width:1;fill:none}.main{stroke:#087f8c;fill:none;stroke-width:3}.alt{stroke:#a34b32;fill:none;stroke-width:3;stroke-dasharray:8 5}</style><text x="40" y="30" font-weight="bold">天气例：证据如何把先验更新为后验</text><defs><marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f8c"/></marker></defs><text x="95" y="72" font-weight="bold">看到晚霞之前：先验</text><rect x="55" y="105" width="250" height="35" fill="#edf0e9"/><rect x="55" y="105" width="181.5" height="35" fill="#087f8c"/><text x="55" y="97">P(晴) = 0.726</text><rect x="55" y="190" width="250" height="35" fill="#edf0e9"/><rect x="55" y="190" width="68.5" height="35" fill="#a34b32"/><text x="55" y="182">P(非晴) = 0.274</text><path d="M330 165H430" stroke="#087f8c" stroke-width="3" marker-end="url(#arrb)"/><text x="380" y="135" text-anchor="middle">证据：晚霞</text><text x="380" y="190" text-anchor="middle">似然 0.7 / 0.1</text><text x="500" y="72" font-weight="bold">看到晚霞之后：后验</text><rect x="455" y="105" width="250" height="35" fill="#edf0e9"/><rect x="455" y="105" width="237.2" height="35" fill="#087f8c"/><text x="455" y="97">P(晴 | 晚霞) = 0.949</text><rect x="455" y="190" width="250" height="35" fill="#edf0e9"/><rect x="455" y="190" width="12.8" height="35" fill="#a34b32"/><text x="455" y="182">P(非晴 | 晚霞) = 0.051</text><text x="55" y="295">似然比 0.7 / 0.1 = 7，使证据明显偏向“晴”；后验仍同时受先验影响。</text></svg>