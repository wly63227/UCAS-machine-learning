<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="三种局部结构：箭头相遇方式决定阻断规则"><rect width="760" height="360" fill="#fff"/><style>text{font:14px sans-serif;fill:#23383b}.axis{stroke:#6b7779;stroke-width:1;fill:none}.main{stroke:#087f8c;fill:none;stroke-width:3}.alt{stroke:#a34b32;fill:none;stroke-width:3;stroke-dasharray:8 5}</style><text x="40" y="30" font-weight="bold">三种局部结构：箭头相遇方式决定阻断规则</text><text x="30" y="65">链：A → B → C</text><circle cx="320" cy="90" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="315" y="95">A</text><circle cx="470" cy="90" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="465" y="95">B</text><circle cx="620" cy="90" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="615" y="95">C</text><path d="M342 90H448" stroke="#333"/><path d="M441 85L448 90L441 95" fill="none" stroke="#333"/><path d="M492 90H598" stroke="#333"/><path d="M591 85L598 90L591 95" fill="none" stroke="#333"/><text x="30" y="160">分叉：A ← B → C</text><circle cx="320" cy="185" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="315" y="190">A</text><circle cx="470" cy="185" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="465" y="190">B</text><circle cx="620" cy="185" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="615" y="190">C</text><path d="M342 185H448" stroke="#333"/><path d="M349 180L342 185L349 190" fill="none" stroke="#333"/><path d="M492 185H598" stroke="#333"/><path d="M591 180L598 185L591 190" fill="none" stroke="#333"/><text x="30" y="255">碰撞：A → B ← C</text><circle cx="320" cy="280" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="315" y="285">A</text><circle cx="470" cy="280" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="465" y="285">B</text><circle cx="620" cy="280" r="22" fill="#e6f2f0" stroke="#087f8c"/><text x="615" y="285">C</text><path d="M342 280H448" stroke="#333"/><path d="M441 275L448 280L441 285" fill="none" stroke="#333"/><path d="M492 280H598" stroke="#333"/><path d="M499 275L492 280L499 285" fill="none" stroke="#333"/><text x="30" y="340">前两种：给定 B 阻断路径；碰撞：给定 B 或其后代会打开路径。</text></svg>