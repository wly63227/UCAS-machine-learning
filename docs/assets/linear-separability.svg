<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="线性可分与线性不可分的几何区别"><rect width="760" height="360" fill="#fff"/><style>text{font:14px sans-serif;fill:#23383b}.axis{stroke:#6b7779;stroke-width:1;fill:none}.main{stroke:#087f8c;fill:none;stroke-width:3}.alt{stroke:#a34b32;fill:none;stroke-width:3;stroke-dasharray:8 5}</style><text x="40" y="30" font-weight="bold">线性可分与线性不可分的几何区别</text><g transform="translate(30 60)"><rect width="330" height="245" rx="10" fill="#fbfbf8" stroke="#d6ddd8"/><text x="165" y="25" text-anchor="middle" font-weight="bold">线性可分：存在一条直线分开两类</text><path d="M35 215V45M35 215H300" class="axis"/><path d="M135 210L220 48" class="main"/><circle cx="70" cy="170" r="7" fill="#087f8c"/><circle cx="90" cy="150" r="7" fill="#087f8c"/><circle cx="102" cy="185" r="7" fill="#087f8c"/><circle cx="120" cy="145" r="7" fill="#087f8c"/><rect x="198" y="123" width="14" height="14" fill="#a34b32"/><rect x="223" y="98" width="14" height="14" fill="#a34b32"/><rect x="238" y="138" width="14" height="14" fill="#a34b32"/><rect x="260" y="83" width="14" height="14" fill="#a34b32"/></g>
<g transform="translate(400 60)"><rect width="330" height="245" rx="10" fill="#fbfbf8" stroke="#d6ddd8"/><text x="165" y="25" text-anchor="middle" font-weight="bold">线性不可分：XOR</text><path d="M35 215V45M35 215H300" class="axis"/><circle cx="90" cy="165" r="8" fill="#087f8c"/><circle cx="250" cy="75" r="8" fill="#087f8c"/><rect x="82" y="67" width="16" height="16" fill="#a34b32"/><rect x="242" y="157" width="16" height="16" fill="#a34b32"/><text x="165" y="235" text-anchor="middle">任意直线都会让至少一个点落错侧</text></g></svg>